<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trustlens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <div>
          <div class="brand-title">Trustlens</div>
          <div class="brand-sub">Live Deepfake Detection</div>
        </div>
      </div>
      <div class="platform-badge" id="platformBadge">
        <span class="dot dot-grey" id="platformDot"></span>
        <span id="platformName">Checking...</span>
      </div>
    </header>

    <!-- Main Risk Overview Card -->
    <section class="card risk-card">
      <div class="risk-gauge-container">
        <svg class="risk-gauge" viewBox="0 0 100 100">
          <circle class="gauge-bg" cx="50" cy="50" r="42" />
          <circle class="gauge-fill" id="gaugeFill" cx="50" cy="50" r="42" />
        </svg>
        <div class="gauge-content">
          <div class="risk-percentage" id="riskPercentage">0%</div>
          <div class="risk-sub-label">MANIPULATION RISK</div>
        </div>
      </div>
      <div class="risk-status">
        <span class="badge badge-unavailable" id="riskBadge">STANDBY</span>
      </div>
      <div class="risk-description" id="riskDescription">
        Start monitoring to analyse participant facial video streams for AI synthesis artifacts.
      </div>
    </section>

    <!-- Telemetry Stats Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">FRAMES</div>
        <div class="stat-value" id="statFrames">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">FACES</div>
        <div class="stat-value" id="statFaces">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">DURATION</div>
        <div class="stat-value" id="statDuration">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CONFIDENCE</div>
        <div class="stat-value" id="statConfidence">--</div>
      </div>
    </section>

    <!-- Control Actions -->
    <section class="controls-section">
      <div class="button-group" id="idleControls">
        <button class="btn btn-primary" id="btnStart">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          Start Monitoring
        </button>
      </div>
      <div class="button-group hidden" id="activeControls">
        <button class="btn btn-secondary" id="btnPause">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
          Pause
        </button>
        <button class="btn btn-danger" id="btnStop">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2" />
          </svg>
          Stop
        </button>
      </div>
    </section>

    <!-- Detection History -->
    <section class="history-section">
      <div class="history-header">
        <span class="history-title">RECENT THREAT LOGS</span>
        <button class="btn-text" id="btnClearHistory">Clear</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No anomalies detected yet in this session.</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="version">Trustlens v1.0.0</span>
      <a href="../options/options.html" target="_blank" class="footer-link">Options</a>
    </footer>
  </div>

  <script src="../utils/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
